id: mobile
name: "Mobile App Development"
description: "Cross-platform and native mobile applications using Flutter, React Native, Swift (iOS), or Kotlin (Android)."
detection_indicators:
  - "pubspec.yaml"
  - "app.json"
  - "Podfile"
  - "build.gradle"
recommended_mcps:
  - id: mobile-tools
    name: "Mobile Device / Emulator MCP"
    purpose: "Inspect connected emulators, device logs, and application lifecycle."
recommended_agents:
  - id: "engineering/engineering-mobile-app-builder.md"
    name: "Mobile App Builder"
    source: "https://github.com/msitarzewski/agency-agents/blob/main/engineering/engineering-mobile-app-builder.md"
    purpose: "Flutter/React Native navigation, widget layouts, gestures, and animations."
  - id: "engineering/engineering-mobile-release-engineer.md"
    name: "Mobile Release Engineer"
    source: "https://github.com/msitarzewski/agency-agents/blob/main/engineering/engineering-mobile-release-engineer.md"
    purpose: "App Store / Play Store builds, signing, Fastlane, and deployment."
  - id: "engineering/engineering-backend-architect.md"
    name: "Backend Architect"
    source: "https://github.com/msitarzewski/agency-agents/blob/main/engineering/engineering-backend-architect.md"
    purpose: "Mobile API sync, offline-first caching, and push notification services."
  - id: "engineering/engineering-code-reviewer.md"
    name: "Code Reviewer"
    source: "https://github.com/msitarzewski/agency-agents/blob/main/engineering/engineering-code-reviewer.md"
    purpose: "Mobile code review, memory leak inspection, and platform guideline checks."
starter_systems:
  - name: "Navigation"
    purpose: "Deep linking, route guards, tabs, and navigation stack management."
  - name: "LocalCache"
    purpose: "Offline-first persistence, secure storage, and local state sync."
  - name: "RemoteClient"
    purpose: "HTTP client, error interception, auth token refresh, and retry logic."
  - name: "DesignSystem"
    purpose: "Mobile typography, color tokens, reusable UI components, and themes."
