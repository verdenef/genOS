id: ai-data
name: "AI, Machine Learning & Data Engineering"
description: "AI agents, LLM orchestration, data processing pipelines, and ML models using Python, PyTorch, LangChain, or Pandas."
detection_indicators:
  - "pyproject.toml"
  - "requirements.txt"
  - "environment.yml"
recommended_mcps:
  - id: jupyter
    name: "Jupyter / Notebook MCP"
    purpose: "Execute code cells, inspect in-memory dataframes, and render plots."
  - id: vectordb
    name: "Vector Database MCP"
    purpose: "Inspect embeddings, test similarity queries, and verify indexes."
recommended_agents:
  - role: "AI Systems Architect"
    purpose: "Prompt engineering frameworks, model routing, and context management."
  - role: "Data Engineer"
    purpose: "ETL pipelines, data cleaning, validation schemas, and streaming workers."
starter_systems:
  - name: "IngestionPipeline"
    purpose: "Source data loading, transformation, chunking, and sanitization."
  - name: "ModelEngine"
    purpose: "LLM client wrappers, temperature/token settings, and fallback providers."
  - name: "VectorStorage"
    purpose: "Embedding generation, vector indexing, and hybrid retrieval search."
  - name: "Evaluation"
    purpose: "Benchmarking, accuracy assertions, hallucination checks, and metrics."
